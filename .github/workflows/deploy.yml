name: Deploy to Live

# Mirrors the 7PXL Rugby deploy: FTP the static game to the Xleaguerl webspace on
# every push to main — into its own folder, alongside the rugby game.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-game:
    name: Deploy Game Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust asset versions in index.html
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/\?v=[0-9a-zA-Z]*/\?v=$HASH/g" index.html
          echo "Cache-bust version: $HASH"

      - name: FTP Deploy Game
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /webspace/siteapps/WordPress-174457/htdocs/SuperKOBoxing/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            node_modules/**
            package.json
            package-lock.json
            .gitignore
            .nojekyll
            README.md
